<!DOCTYPE html>
  <head>
    <link rel="stylesheet" href="style.css"> 
    <title>
      Login-page
    </title>

 <body>
  <div class="login-box">
     <form action="" method="post">
        <h2>LOGIN</h2><br><br>

       <label class="lbl">Password: </label>
       <input type="text" name="password" placeholder="enter password"class="input-box" required><br><br><br>
        <input type="checkbox">
        <label class="lbl" >Remember  Me</label>  <a href="forgot-password.html">Forgot Password?</a><br><br><br>
        <input type="submit" name="Login" class="btn-primary">
        <label class="lbl">Dont have an account?<a href="#">Register</a></label>
     </form>
  </div>
 </body>
</html>
